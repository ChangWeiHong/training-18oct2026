    - generic [ref=f45e100]:
      - generic [ref=f45e101]:
        - heading "How the analysis works" [level=2] [ref=f45e102]
        - button "Close" [active] [ref=f45e103] [cursor=pointer]
      - img "How the analysis works A readings CSV becomes features per rundown. Features are compared with a reference envelope and an Isolation Forest to give the signature result, and checked against your spec limits to give the specification result." [ref=f45e108]:
        - generic [ref=f45e115]: YOUR SPEC LIMITS
        - generic [ref=f45e124]:
          - generic [ref=f45e125]: Readings CSV
          - generic [ref=f45e126]: Features
          - generic [ref=f45e127]: Reference envelope
          - generic [ref=f45e128]: Isolation Forest
          - generic [ref=f45e129]: Signature result
          - generic [ref=f45e130]: Spec result
        - generic [ref=f45e131]:
          - generic [ref=f45e132]: one row per sample
          - generic [ref=f45e133]: per rundown
          - generic [ref=f45e134]: 5th to 95th pct band
          - generic [ref=f45e135]: unusual combinations
          - generic [ref=f45e136]: typical / investigate
          - generic [ref=f45e137]: within / outside
      - list [ref=f45e138]:
        - listitem [ref=f45e139]: "Features. Each rundown becomes a short list: final and peak torque, snug angle, post-snug angle, elastic slope, torque drops, and how far the curve strays from the reference median."
        - listitem [ref=f45e140]: Reference. Normal rundowns set the expected band, the 5th to 95th percentile at each angle after snug. Without a reference file, the upload is compared with itself.
        - listitem [ref=f45e141]: Signature result. A rundown is worth investigating when one feature sits far outside the reference spread, the whole curve strays far from the median, or the Isolation Forest finds the mix of features unusual.
        - listitem [ref=f45e142]: Spec result. Torque and post-snug angle are checked against the limits you enter. The reference plays no part.
      - heading "Limits" [level=3] [ref=f45e143]
      - list [ref=f45e144]:
        - listitem [ref=f45e145]: All sample data is synthetic.
        - listitem [ref=f45e146]: The detector was checked on 3 held-out synthetic seeds. Each had only 3 to 5 abnormal rundowns that were still in spec, so the recall figures rest on very few cases.
        - listitem [ref=f45e147]: A flag means worth checking. It does not confirm a fault.
        - listitem [ref=f45e148]: Real nutrunner traces may differ from the synthetic ones.
        - listitem [ref=f45e149]: In the 3D view, rotation is measured. Travel and compression are illustrative.
      - heading "Keys" [level=3] [ref=f45e150]
      - paragraph [ref=f45e151]: Left and Right step one sample, with Shift ten. In the 3D view, Q and E rotate, plus and minus zoom, 0 resets.
