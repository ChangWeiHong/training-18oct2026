    - generic [ref=f48e99]:
      - generic [ref=f48e100]:
        - heading "How the analysis works" [level=2] [ref=f48e101]
        - button "Close" [active] [ref=f48e102] [cursor=pointer]
      - 'img "How the analysis works A readings CSV becomes features per rundown. Features are compared with a reference envelope and an Isolation Forest to give the signature result: typical, worth investigating or can''t assess. They are checked against your spec limits to give the spec result: within, outside, partly checked or not supplied." [ref=f48e107]':
        - generic [ref=f48e114]: YOUR SPEC LIMITS
        - generic [ref=f48e123]:
          - generic [ref=f48e124]: Readings CSV
          - generic [ref=f48e125]: Features
          - generic [ref=f48e126]: Reference envelope
          - generic [ref=f48e127]: Isolation Forest
          - generic [ref=f48e128]: Signature result
          - generic [ref=f48e129]: Spec result
        - generic [ref=f48e130]:
          - generic [ref=f48e131]: sample rows
          - generic [ref=f48e132]: per rundown
          - generic [ref=f48e133]: 5th to 95th pct band
          - generic [ref=f48e134]: unusual combinations
          - generic [ref=f48e135]: typical
          - generic [ref=f48e136]: worth investigating
          - generic [ref=f48e137]: can't assess
          - generic [ref=f48e138]: within
          - generic [ref=f48e139]: outside
          - generic [ref=f48e140]: partly checked
          - generic [ref=f48e141]: not supplied
      - list [ref=f48e142]:
        - listitem [ref=f48e143]: "Features. Each rundown becomes a short list: final and peak torque, snug angle, post-snug angle, elastic slope, torque drops, and how far the curve strays from the reference median."
        - listitem [ref=f48e144]: Reference. The reference rundowns set the expected band, the 5th to 95th percentile at each angle after snug. The tool assumes they are good rundowns. Without a reference file, the upload is compared with itself, so a shift across the whole batch can hide.
        - listitem [ref=f48e145]: Signature result. A rundown is worth investigating when one feature sits far outside the reference spread, the whole curve strays far from the median, the rotation runs past the reference curve, or the Isolation Forest finds the mix of features unusual. Typical means statistically similar to the reference. It does not approve the fastening. Can't assess means the reference or the trace gave too little to compare.
        - listitem [ref=f48e146]: Spec result. Torque and post-snug angle are checked against the limits you enter. The reference plays no part. A rundown is within only when every limit you entered was checked and passed. Partly checked means a limit could not be tested. Not supplied means you entered no limits.
      - heading "Limits" [level=3] [ref=f48e147]
      - list [ref=f48e148]:
        - listitem [ref=f48e149]: The tool reads continuous-drive tightening traces only.
        - listitem [ref=f48e150]: All sample data is synthetic.
        - listitem [ref=f48e151]: The detector was checked on 3 held-out synthetic seeds. Each had only 3 to 5 abnormal rundowns that were still in spec, so the recall figures rest on very few cases.
        - listitem [ref=f48e152]: A flag means worth checking. It does not confirm a fault.
        - listitem [ref=f48e153]: Real nutrunner traces may differ from the synthetic ones.
        - listitem [ref=f48e154]: In the 3D view, rotation is measured. Travel and compression are illustrative.
      - heading "Keys" [level=3] [ref=f48e155]
      - paragraph [ref=f48e156]: Left and Right step one sample, with Shift ten. In the 3D view, Q and E rotate, W and S tilt, plus and minus zoom, 0 resets.
